name: CI

on:
  push:                               # every push to any branch
  pull_request:
    branches: [develop, production]         # and every PR targeting these

permissions:
  contents: read                      # least privilege: CI only needs to read code

concurrency:                          # a new push cancels the still-running old run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true          # reuse downloaded packages between runs

      - name: Install Python + dependencies (exactly as locked)
        run: uv sync --locked         # fails if uv.lock is out of date with pyproject.toml

      - name: Format check
        run: uv run ruff format --check   # check only; CI never modifies code

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy

      - name: Tests + coverage
        run: uv run pytest -m "not live" --cov --cov-report=term-missing

  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR branch follows type/short-description
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feature|fix|chore|docs|refactor|test|ci|build)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch '$BRANCH' must match type/short-description"
            exit 1
          fi
